name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: ipgeo-linux
            executable: ipgeo
          - os: macos-latest
            artifact_name: ipgeo-macos
            executable: ipgeo
          - os: windows-latest
            artifact_name: ipgeo-windows
            executable: ipgeo.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ipgeo/ipgeo.csproj

      - name: Build
        run: dotnet publish ipgeo/ipgeo.csproj -c Release -r ${{ matrix.os == 'windows-latest' && 'win-x64' || matrix.os == 'macos-latest' && 'osx-arm64' || 'linux-x64' }} --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o ./publish/${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: publish/${{ matrix.artifact_name }}/*

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ipgeo-linux/ipgeo
            artifacts/ipgeo-macos/ipgeo
            artifacts/ipgeo-windows/ipgeo.exe
          draft: false
          prerelease: false
          generate_release_notes: true